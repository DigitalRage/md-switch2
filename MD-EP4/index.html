<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murder Drones Episode 4 Cabin Fever</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; background: #10151a; color: #f4f2ed; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               background: linear-gradient(135deg, #10151a, #1e2930); }
        .player { width: min(900px, 100%); padding: 24px; background: #182126;
                  border: 1px solid #41515a; box-shadow: 0 18px 60px rgba(0,0,0,.35); }
        header { display: flex; justify-content: space-between; align-items: end;
                 gap: 20px; margin-bottom: 18px; }
        h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); }
        .status { margin: 0; color: #a8bdc4; font-size: .85rem; }
        .screen { aspect-ratio: 16 / 9; display: grid; place-items: center;
                  background: #080a0c; overflow: hidden; }
        img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
        button, a { border: 1px solid #657982; padding: 10px 15px; color: #f4f2ed;
                    background: #27343b; font: inherit; text-decoration: none; cursor: pointer; }
        button:hover, button:focus-visible, a:hover, a:focus-visible {
            border-color: #d4a35d; background: #35474f;
        }
        .back { margin-left: auto; }
        #seekBar { width: 100%; margin-top: 14px; }
    </style>
    <link rel="stylesheet" href="../player.css">
</head>
<body>
    <main class="player" data-frame-count="15128" data-source-fps="12" data-frame-path="MD-EP-Cabin_Fever-CC">
        <header class="player-header"><div><p class="kicker">Episode 04 / frame archive</p><h1>Cabin Fever</h1></div><p class="status"><strong id="frameNumber">1 / 15128</strong><span>12 FPS source</span></p></header>
        <div class="screen"><img id="frame" alt="Episode 4 Cabin Fever frame"></div>
        <div class="timeline"><span id="timeDisplay">0:00 / 21:00</span><input type="range" id="seekBar" min="0" max="15127" value="0" aria-label="Seek through episode frames"><span>FRAME SEEK</span></div>
        <div class="controls"><button class="icon-button" id="stepBackButton" aria-label="Previous frame" title="Previous frame"><img class="control-icon" src="../assets/icons/25c0.png" alt=""><span class="step-divider" aria-hidden="true">|</span></button><button id="rewindButton"><img class="control-icon" src="../assets/icons/23ea.png" alt=""> -10 SEC</button><button id="playButton" aria-pressed="true"><img class="control-icon" src="../assets/icons/23f8.png" alt=""> PAUSE</button><button id="forwardButton">+10 SEC <img class="control-icon" src="../assets/icons/23e9.png" alt=""></button><button class="icon-button" id="stepForwardButton" aria-label="Next frame" title="Next frame"><img class="control-icon" src="../assets/icons/25b6.png" alt=""><span class="step-divider" aria-hidden="true">|</span></button></div>
        <div class="secondary-controls"><div class="utility"><button id="loopButton" aria-pressed="true"><img class="control-icon" src="../assets/icons/1f501.png" alt=""> LOOP</button><button id="zoomButton" aria-pressed="false">ZOOM</button><button id="settingsButton">SETTINGS</button></div><div class="utility"><button id="fullscreenButton">FULLSCREEN</button><a class="back-link" id="backButton" href="../index.html">BACK TO ARCHIVE</a></div></div>
        <div class="settings" id="settings" hidden><div class="setting"><label for="fpsSelect">Playback rate</label><select id="fpsSelect"><option value="6">6 FPS</option><option value="12" selected>12 FPS</option><option value="24">24 FPS</option></select></div><div class="setting"><span>Keyboard</span><span>SPACE play / pause, J / L jump, arrows step</span></div><div class="setting"><span>Source</span><span>Local JPEG frame sequence</span></div></div>
        <p class="hint">Frame archive // use the seek bar for precision</p>
    </main>

    <script type="text/plain">
        const FRAME_COUNT = 15128;
        const SOURCE_FPS = 12;
        let FPS = 12;
        let FRAME_TIME = 1000 / FPS;
        let FRAME_STEP = SOURCE_FPS / FPS;
        const JUMP_FRAMES = () => SOURCE_FPS * 10;
        const MAX_CACHED_FRAMES = 6;
        const PREFETCH_DISTANCE = 3;

        let index = 0;
        let playing = true;
        let rafId = 0;
        let lastPaintTime = 0;

        const frameCache = new Map();
        const img = document.getElementById("frame");
        const frameNumber = document.getElementById("frameNumber");
        const seekBar = document.getElementById("seekBar");
        const playButton = document.getElementById("playButton");

        function getFramePath(frameIndex) {
            const num = String(frameIndex + 1).padStart(6, "0");
            return `MD-EP-Cabin_Fever-CC/frame_${num}.jpeg`;
        }

        function pruneCache() {
            while (frameCache.size > MAX_CACHED_FRAMES) {
                const oldestKey = frameCache.keys().next().value;
                frameCache.delete(oldestKey);
            }
        }

        function preloadFrame(frameIndex) {
            if (frameIndex < 0 || frameIndex >= FRAME_COUNT || frameCache.has(frameIndex)) {
                return;
            }

            const image = new Image();
            image.decoding = "async";
            image.onload = () => {
                frameCache.set(frameIndex, image.src);
                pruneCache();
            };
            image.onerror = () => {
                frameCache.delete(frameIndex);
            };
            image.src = getFramePath(frameIndex);
            frameCache.set(frameIndex, image.src);
            pruneCache();
        }

        function prefetchAround(currentIndex) {
            for (let offset = -PREFETCH_DISTANCE; offset <= PREFETCH_DISTANCE; offset++) {
                const frameIndex = currentIndex + offset * FRAME_STEP;
                if (frameIndex >= 0 && frameIndex < FRAME_COUNT) {
                    preloadFrame(frameIndex);
                }
            }
        }

        function setFPS(newFPS) {
            FPS = newFPS;
            FRAME_TIME = 1000 / FPS;
            FRAME_STEP = SOURCE_FPS / FPS;
            if (playing) {
                startPlayback();
            }
        }

        function showFrame() {
            if (index < 0) index = 0;
            if (index >= FRAME_COUNT) index = FRAME_COUNT - 1;

            const src = frameCache.get(index) || getFramePath(index);
            img.src = src;
            frameNumber.textContent = index + 1;
            seekBar.value = index;
            prefetchAround(index);
        }

        function updateFrame(step) {
            index = Math.min(Math.max(index + step, 0), FRAME_COUNT - 1);
            showFrame();
        }

        function playbackLoop(timestamp) {
            if (!playing) return;

            if (timestamp - lastPaintTime >= FRAME_TIME) {
                const elapsedFrames = Math.floor((timestamp - lastPaintTime) / FRAME_TIME);
                lastPaintTime += elapsedFrames * FRAME_TIME;
                updateFrame(elapsedFrames * FRAME_STEP);
            }

            rafId = requestAnimationFrame(playbackLoop);
        }

        function startPlayback() {
            stopPlayback();
            lastPaintTime = performance.now();
            rafId = requestAnimationFrame(playbackLoop);
        }

        function stopPlayback() {
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = 0;
            }
        }

        function togglePlay() {
            playing = !playing;
            if (playing) {
                playButton.innerHTML = '<img class="control-icon" src="../assets/icons/23f8.png" alt=""> Pause';
                startPlayback();
            } else {
                playButton.innerHTML = '<img class="control-icon" src="../assets/icons/25b6.png" alt=""> Play';
                stopPlayback();
            }
        }

        function rewind() {
            stopPlayback();
            index = Math.max(index - JUMP_FRAMES(), 0);
            showFrame();
            if (playing) startPlayback();
        }

        function fastForward() {
            stopPlayback();
            index = Math.min(index + JUMP_FRAMES(), FRAME_COUNT - 1);
            showFrame();
            if (playing) startPlayback();
        }

        seekBar.addEventListener("input", () => {
            stopPlayback();
            index = Number(seekBar.value);
            showFrame();
            if (playing) startPlayback();
        });

        showFrame();
        startPlayback();
    </script>
    <script src="../player.js"></script>
</body>
</html>
