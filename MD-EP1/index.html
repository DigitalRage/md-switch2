<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murder Drones Episode 1 (Final Version)</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; background: #10151a; color: #f4f2ed; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               background: linear-gradient(135deg, #10151a, #1e2930); }
        .player { width: min(900px, 100%); padding: 24px; background: #182126;
                  border: 1px solid #41515a; box-shadow: 0 18px 60px rgba(0,0,0,.35); }
        header { display: flex; justify-content: space-between; align-items: end;
                 gap: 20px; margin-bottom: 18px; }
        h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); }
        .status { margin: 0; color: #a8bdc4; font-size: .85rem; }
        .screen { aspect-ratio: 16 / 9; display: grid; place-items: center;
                  background: #080a0c; overflow: hidden; }
        img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
        button, a { border: 1px solid #657982; padding: 10px 15px; color: #f4f2ed;
                    background: #27343b; font: inherit; text-decoration: none; cursor: pointer; }
        button:hover, button:focus-visible, a:hover, a:focus-visible {
            border-color: #d4a35d; background: #35474f;
        }
        .back { margin-left: auto; }
        #seekBar { width: 100%; margin-top: 14px; }
    </style>
</head>
<body>
    <main class="player">
        <header>
            <h1>Murder Drones Episode 1 (Final Version)</h1>
            <p class="status"><span id="frameNumber">1</span> / 16154</p>
        </header>

        <div class="screen">
            <img id="frame" alt="Episode Frame">
        </div>

        <input type="range" id="seekBar" min="0" max="16153" value="0">

        <div class="controls">
            <button onclick="setFPS(12)">12 FPS</button>
            <button onclick="setFPS(24)">24 FPS</button>
            <button onclick="rewind()">&#9194; -10s</button>
            <button onclick="togglePlay()" id="playButton">&#9208; Pause</button>
            <button onclick="fastForward()">&#9193; +10s</button>
            <a class="back" href="../index.html">Back</a>
        </div>
    </main>

    <script>
        const FRAME_COUNT = 16154;
        let FPS = 12; // Final version default
        let FRAME_TIME = 1000 / FPS;
        const JUMP_FRAMES = () => FPS * 10;
        const MAX_CACHED_FRAMES = () => FPS * 2;
        const FRAME_LOAD_TIMEOUT = 8000;
        const COOLDOWN_INTERVAL_FRAMES = 300;
        const COOLDOWN_DURATION_MS = 60;

        let index = 0;
        let playing = true;
        let playbackToken = 0;
        let lastTime = performance.now();

        const frames = Array.from({ length: FRAME_COUNT }, (_, i) => {
            const num = String(i + 1).padStart(6, "0");
            // The source images are .jpeg files, not .jpg, so use the actual extension.
            return `MD-EP-Pilot-CC/frame_${num}.jpeg`;
        });

        const loadedFrames = new Map();
        const img = document.getElementById("frame");
        const frameNumber = document.getElementById("frameNumber");
        const seekBar = document.getElementById("seekBar");
        const playButton = document.getElementById("playButton");

        function setFPS(newFPS) {
            FPS = newFPS;
            FRAME_TIME = 1000 / FPS;
            loadedFrames.clear();
            stopPlayback();
            startPlayback();
        }

        function loadFrame(frameIndex) {
            if (!loadedFrames.has(frameIndex)) {
                const image = new Image();
                const framePromise = new Promise((resolve, reject) => {
                    let settled = false;
                    const timeout = setTimeout(() => {
                        if (!settled) {
                            settled = true;
                            reject(new Error("timeout"));
                        }
                    }, FRAME_LOAD_TIMEOUT);

                    image.onload = () => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timeout);
                            resolve(image.src);
                        }
                    };
                    image.onerror = () => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timeout);
                            reject(new Error("error"));
                        }
                    };

                    image.src = frames[frameIndex];
                });

                loadedFrames.set(frameIndex, framePromise);

                while (loadedFrames.size > MAX_CACHED_FRAMES()) {
                    loadedFrames.delete(loadedFrames.keys().next().value);
                }
            }
            return loadedFrames.get(frameIndex);
        }

        async function showFrame() {
            try {
                const src = await loadFrame(index);
                img.src = src;
                frameNumber.textContent = index + 1;
                seekBar.value = index;
                return true;
            } catch {
                return false;
            }
        }

        function wait(ms) {
            return new Promise(res => setTimeout(res, ms));
        }

        async function playbackLoop(token) {
            while (playing && token === playbackToken) {
                const now = performance.now();
                const elapsed = now - lastTime;

                if (elapsed >= FRAME_TIME) {
                    lastTime = now;
                    index = Math.min(index + 1, FRAME_COUNT - 1);
                    await showFrame();

                    if (index % COOLDOWN_INTERVAL_FRAMES === 0) {
                        await wait(COOLDOWN_DURATION_MS);
                    }
                }

                await wait(0);
            }
        }

        function startPlayback() {
            playbackToken++;
            lastTime = performance.now();
            playbackLoop(playbackToken);
        }

        function stopPlayback() {
            playbackToken++;
        }

        function togglePlay() {
            playing = !playing;
            if (playing) {
                playButton.innerHTML = "&#9208; Pause";
                startPlayback();
            } else {
                playButton.innerHTML = "&#9654; Play";
                stopPlayback();
            }
        }

        function rewind() {
            stopPlayback();
            index = Math.max(index - JUMP_FRAMES(), 0);
            showFrame();
            if (playing) startPlayback();
        }

        function fastForward() {
            stopPlayback();
            index = Math.min(index + JUMP_FRAMES(), FRAME_COUNT - 1);
            showFrame();
            if (playing) startPlayback();
        }

        seekBar.addEventListener("input", () => {
            stopPlayback();
            index = Number(seekBar.value);
            showFrame();
            if (playing) startPlayback();
        });

        (async () => {
            await loadFrame(0);
            await loadFrame(1);
            await loadFrame(2);
            await showFrame();
            startPlayback();
        })();
    </script>
</body>
</html>
